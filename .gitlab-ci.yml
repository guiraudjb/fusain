# FUSAIN — intégration sur un GitLab privé : contrôles à chaque modification, publication GitLab Pages depuis la branche
# par défaut. Mode d'emploi : deploiement/GITLAB.md.
#
# Les images viennent de Docker Hub. Un GitLab sans accès à Internet passe par son proxy de dépendances ou son
# registre interne : redéfinir IMAGE_PYTHON, IMAGE_NODE et IMAGE_PAGES (Paramètres > CI/CD > Variables).
#
# La recette navigateur complète (Chrome, Firefox, accessibilité) reste sur GitHub (.github/workflows/recette.yml).
# Elle demande Chrome et geckodriver sur l'exécuteur.

variables:
  IMAGE_PYTHON: "python:3.13-slim"
  IMAGE_NODE: "node:22-bookworm-slim"
  IMAGE_PAGES: "alpine:3.22"
  GIT_DEPTH: "20"

stages:
  - controle
  - publication

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Les empreintes (SRI de index.html, cache de sw.js, nomenclature CycloneDX) correspondent aux fichiers :
# sinon le service worker refuserait de s'installer.
coherence:
  stage: controle
  image: $IMAGE_PYTHON
  script:
    - python3 outils/generer.py --verifier

logique:
  stage: controle
  image: $IMAGE_NODE
  script:
    - node --version
    - node --test tests/logique.test.mjs

# GitLab Pages publie le dossier « public » de l'artefact du travail nommé « pages ».
pages:
  stage: publication
  image: $IMAGE_PAGES
  needs: [coherence, logique]
  script:
    - deploiement/copier-site.sh public
    - echo "FUSAIN $(sed -n "s/.*VERSION = '\([^']*\)'.*/\1/p" js/version.js) publié dans public/ ($(find public -type f | wc -l) fichiers)"
  # Archive d'environ 145 Mo : au-delà des 100 Mo admis par défaut (voir deploiement/GITLAB.md, « Taille du site »).
  # Le site publié est conservé par Pages : l'artefact lui-même peut expirer.
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
