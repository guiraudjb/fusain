# FUSAIN — exemple de configuration Nginx (cahier des charges §7.1 et §11)
#
# FUSAIN n'est qu'un dossier de fichiers statiques : ce serveur ne traite aucune donnée.
# Adapter server_name, les chemins des certificats et « root », puis :
#   nginx -t && systemctl reload nginx
#
# Cette configuration pose par en-tête HTTP la politique de sécurité de contenu complète, y compris
# frame-ancestors, qu'une balise <meta> ne peut pas porter (cas de l'hébergement GitHub Pages).

server {
    listen 80;
    server_name fusain.exemple.gouv.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fusain.exemple.gouv.fr;

    ssl_certificate     /etc/ssl/certs/fusain.pem;
    ssl_certificate_key /etc/ssl/private/fusain.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/html/FUSAIN;
    index index.html;
    server_tokens off;

    # Seules les lectures sont utiles à une application statique
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # --- En-têtes de sécurité (répétés dans chaque « location » : add_header ne s'hérite pas dès qu'un bloc en déclare) ---
    set $csp "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types default dompurify 'allow-duplicates'";

    location / {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Fichiers versionnés par le service worker : le cache du navigateur peut être long
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Page d'entrée et service worker : toujours revalidés, pour que les mises à jour soient détectées
    location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)?$ {
        try_files $uri /index.html =404;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache" always;
    }

    # Rien d'autre que l'application n'est servi : ni dépôt git, ni outils, ni tests
    location ~ ^/(\.git|outils|tests|deploiement)(/|$) { return 404; }
    location ~ /\. { return 404; }

    types {
        text/html               html;
        text/css                css;
        text/javascript         js mjs;
        application/json        json;
        application/manifest+json webmanifest;
        image/svg+xml           svg;
        image/png               png;
        image/x-icon            ico;
        font/woff2              woff2;
        font/ttf                ttf;
        text/markdown           md;
    }
}
