<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Politique de sécurité de contenu : repli <meta> (cahier des charges §7.1).
         Sur un serveur maîtrisé, la même politique est à délivrer par en-tête HTTP,
         complétée de frame-ancestors 'none' (sans effet dans une balise meta). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types default dompurify 'allow-duplicates'">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#000091">
    <meta name="description" content="FUSAIN — éditeur visuel de diagrammes Mermaid au format A4 ou A3. Tous les traitements s'exécutent dans le navigateur.">
    <title>FUSAIN — Fabrique Universelle de Schémas Accessibles, Intuitifs et Normés</title>
    <link rel="icon" href="./icones/fusain.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icones/fusain-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./libs/dsfr-v1.15.4/dsfr.min.css" integrity="sha384-pSuXpWGkpqKPyjAvU65RYbgM3zqf8TFZLBvox8Ykh2FqYyjnDbN7H+QUVrYIhOTa">
    <link rel="stylesheet" href="./libs/dsfr-v1.15.4/utility/icons/icons.min.css" integrity="sha384-S+ttVpcWWHLn1CEGnBmT+A2KKDlXcNJ/vo6Qh/XYK7/0Lo+X/gM2k1vf5fDkssFu">
    <link rel="stylesheet" href="./css/fusain.css" integrity="sha384-fHrWjK6uV9UDVgSnGUDbIffGYy+bzH8rvrOZmMDG/gvVSUYiix4Q3LdZg48pmgGB">
</head>
<body>
    <div class="fr-skiplinks">
        <nav class="fr-container" role="navigation" aria-label="Accès rapide">
            <ul class="fr-skiplinks__list">
                <li><a class="fr-link" href="#fusain-scene">Schéma</a></li>
                <li><a class="fr-link" href="#fusain-proprietes">Propriétés</a></li>
                <li><a class="fr-link" href="#fusain-pages">Pages</a></li>
            </ul>
        </nav>
    </div>

    <header role="banner" class="fr-header fusain-entete">
        <div class="fr-header__body">
            <div class="fr-container--fluid fr-px-2w">
                <div class="fr-header__body-row">
                    <div class="fr-header__brand">
                        <div class="fr-header__brand-top">
                            <div class="fr-header__logo">
                                <p class="fr-logo">République<br>Française</p>
                            </div>
                            <div class="fr-header__navbar">
                                <button type="button" class="fr-btn--menu fr-btn" data-fr-opened="false" aria-controls="fusain-menu" aria-haspopup="menu" id="fusain-btn-menu" title="Menu">Menu</button>
                            </div>
                        </div>
                        <div class="fr-header__service">
                            <p class="fr-header__service-title">FUSAIN <span class="fr-badge fr-badge--sm fr-badge--green-emeraude">Bêta</span></p>
                            <p class="fr-header__service-tagline">Fabrique Universelle de Schémas Accessibles, Intuitifs et Normés</p>
                        </div>
                    </div>
                    <div class="fr-header__tools">
                        <div class="fr-header__tools-links">
                            <ul class="fr-btns-group">
                                <li><button type="button" class="fr-btn fr-icon-moon-line" data-action="theme">Thème sombre</button></li>
                                <li><button type="button" class="fr-btn fr-icon-information-line" data-action="apropos">À propos</button></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="fr-header__menu fr-modal" id="fusain-menu" aria-labelledby="fusain-btn-menu">
            <div class="fr-container">
                <button type="button" class="fr-btn--close fr-btn" aria-controls="fusain-menu" title="Fermer">Fermer</button>
                <div class="fr-header__menu-links"></div>
            </div>
        </div>
    </header>

    <div id="fusain-bandeau"></div>

    <main class="fusain-app" id="fusain-app">
        <h1 class="fr-sr-only">FUSAIN — éditeur de schémas</h1>
        <div class="fusain-barre" role="toolbar" aria-label="Barre d'outils" id="fusain-barre"></div>

        <div class="fusain-corps">
            <nav class="fusain-pages" id="fusain-pages" aria-label="Pages du document" tabindex="-1"></nav>

            <section class="fusain-centre" aria-label="Espace de travail">
                <div class="fusain-code" id="fusain-code" hidden>
                    <div class="fusain-code__entete">
                        <label class="fr-label" for="fusain-code-zone">Code Mermaid de la page</label>
                        <p class="fr-badge fr-badge--sm" id="fusain-code-etat"></p>
                    </div>
                    <div class="fusain-code__editeur">
                        <div class="fusain-code__lignes" id="fusain-code-lignes" aria-hidden="true"></div>
                        <textarea id="fusain-code-zone" class="fusain-code__zone" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
                    </div>
                </div>
                <div class="fusain-vue">
                    <div class="fusain-erreur" id="fusain-erreur" role="alert" hidden></div>
                    <div class="fusain-scene" id="fusain-scene" tabindex="-1">
                        <div class="fusain-feuille" id="fusain-feuille"></div>
                    </div>
                </div>
            </section>

            <aside class="fusain-proprietes" id="fusain-proprietes" aria-label="Propriétés" tabindex="-1"></aside>
        </div>
    </main>

    <div class="fusain-messages" id="fusain-messages" aria-live="polite"></div>
    <p class="fr-sr-only" id="fusain-annonce" role="status" aria-live="polite"></p>
    <div id="fusain-modales"></div>
    <input type="file" id="fusain-fichier" accept=".json,.mmd,.txt,application/json,text/plain" hidden>

    <script src="./libs/dompurify-v3.4.17/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx"></script>
    <script src="./js/confiance.js" integrity="sha384-0zSIN/PFtxzhQ36k7fComEtAcEggQ+kiUEYgciM/IkqFeGMfRo7qxD+6jiKmbvXk"></script>
    <script src="./libs/mermaid-v12.3.0/mermaid.min.js" integrity="sha384-HHW54r639fK42Ip0coGF3mz8oSiGn0eEoWNTLs75X7H63pLSDBa0Tqs0RwGmLlXE"></script>
    <!-- Extension ZenUML de Mermaid : déclarée ici pour son empreinte, chargée seulement quand une page en a besoin (js/rendu.js) -->
    <!-- Icônes du DSFR pour les schémas d'architecture : même principe, lues à la première utilisation (js/icones.js) -->
    <link rel="fusain-extension" id="fusain-icones" href="./libs/dsfr-v1.15.4/icones-dsfr.json" integrity="sha384-R63ByrvoWH+lhU4ZVX5SlPGf0k2mrpK7hnq8CL9lQ/otWzOcZ6CjsBHtYQycA1Kb">
    <link rel="fusain-extension" id="fusain-pictogrammes" href="./icones/pictogrammes.json" integrity="sha384-C83XRYqMEAS/iM4zvV/TZgpvb9eKsnCqlZ02uhWAG0HPi3vyCNBkNXWjDAtq+PCC">
    <link rel="fusain-extension" id="fusain-illustrations" href="./icones/illustrees/index.json" integrity="sha384-MTDWIDWn5pOWoGVXicbvM1SZQHvGhCW6xg9IPmUDdXNxmdcxHsg6OnbVCPxjhO3y">
    <!-- Cartes : D3, client TopoJSON et catalogue des fonds de carte, lus à la première carte (js/geo.js) -->
    <link rel="fusain-extension" id="fusain-d3" href="./libs/d3-v7.9.2/d3.min.js" integrity="sha384-LxfWGZyh6PaLjBRPf7NWiEYs9Mn0UQ6ZmqbLLZhxlOBBNWF2a2K0Pfc5efkrNnhQ">
    <link rel="fusain-extension" id="fusain-topojson" href="./libs/topojson-client-v3.1.0/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67">
    <link rel="fusain-extension" id="fusain-cartes" href="./cartes/index.json" integrity="sha384-kX/v+DOJ8TRu8VecWnsc9D72+44ch9Lw/9AqIqV7kQ5iBsk88NXipydgbLvTFeZ4">
    <link rel="fusain-extension" id="fusain-zenuml" href="./libs/mermaid-zenuml-v1.0.1/mermaid-zenuml.min.js" integrity="sha384-0eYxYR32H2yKdNQgDXFSft9JyJx9jClfEFSiJQHZzy93z0DG4M7o9kQIPKQH/sYg">
    <script src="./libs/jspdf-v4.2.1/jspdf.umd.min.js" integrity="sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3"></script>
    <script src="./libs/svg2pdf-v2.9.0/svg2pdf.umd.min.js" integrity="sha384-vNyMZsDT/d+7kwFpauX34njiwXMRe3ZxsLNeO1NooSoUpIkeO77S39xRAJ4VQ+D2"></script>
    <script type="module" src="./libs/dsfr-v1.15.4/dsfr.module.min.js" integrity="sha384-jKJord+a+yLY2qxYzr9YPM3D51W5+Np9Me4TM6BlIh4z5g6xhr3S4B44CIeN8rQ9"></script>
    <script type="module" src="./js/app.js" integrity="sha384-YbbVFvnBlFtzdudcRw4yuUQcJ8lhD9gwfznvHmQ5MUJGmPuKSZTr7M10erRK51Zq"></script>
</body>
</html>
